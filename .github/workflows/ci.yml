name: Build check

# The dashboard is published as part of the portfolio site (dewapriya.com),
# whose deploy workflow builds this repository. This only checks it builds.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
